
<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Francisco | 1.º Aniversário</title>

    <meta name="description" content="1.º aniversário do Francisco">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <img src="assets/cloud-left.png"
             class="cloud cloud-left"
             alt="">

        <img src="assets/cloud-right.png"
             class="cloud cloud-right"
             alt="">

        <img src="assets/balloon-blue.png"
             class="balloon balloon-left"
             alt="">

        <img src="assets/balloon-beige.png"
             class="balloon balloon-right"
             alt="">

        <div class="stars"></div>

    </div>

    <!-- Content -->

    <main class="wrapper">

        <img src="assets/goose.png"
             alt="Francisco"
             class="goose">

        <h1>
            Francisco
        </h1>

        <div class="subtitle">

            <span class="line"></span>

            <span>1.º ANIVERSÁRIO</span>

            <span class="line"></span>

        </div>

        <div class="heart">

            🤍

        </div>

        <p class="intro">

            Hoje celebramos o primeiro ano do Francisco.

        </p>

        <p class="message">

            Obrigado por nos ajudares a guardar estas memórias para sempre.

        </p>

        <div class="divider"></div>

        <button id="openGallery">

            📸

            <span>

                Ver Fotografias

            </span>

        </button>

        <footer>

            <div class="footer-heart">

                🤍

            </div>

            <p class="signature">

                Com carinho,

            </p>

            <h2>

                Diana, Tiago e Francisco 🤍

            </h2>

            <p class="quote">

                "As melhores memórias são aquelas que vivemos juntos."

            </p>

        </footer>

    </main>

    <canvas id="confetti"></canvas>

    <script src="script.js"></script>

</body>

</html>
